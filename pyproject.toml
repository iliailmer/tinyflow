[project]
name = "tinyflow"
version = "0.3.0"
description = "Implementing elementary flow matching algorithms in tinygrad"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hydra-core>=1.3.2",
  "loguru>=0.7.3",
  "matplotlib>=3.10.8",
  "mlflow>=3.6.0",
  "numpy>=2.2.1",
  "pillow>=12.1.1",
  "scikit-image>=0.25.2",
  "scikit-learn>=1.6.0",
  "tinygrad>=0.14.0",
  "tqdm>=4.67.1",
]

[tool.pyright]
venv = "."
venvPath = ".venv"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.8.0", "pyright>=1.1.0", "pre-commit>=4.0.0"]
eval = [
    "clean-fid>=0.1.35",
]


[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "ERA", # commented out code
]
ignore = [
  "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
